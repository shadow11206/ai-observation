# ============================================================
# 追踪体系更新配置（update_tracking.py 使用）
# ============================================================
tracking:
  # 新人准入门槛（同时满足才自动加入）
  auto_add_threshold:
    min_appearances: 3          # 过去 7 天在信息源中出现 ≥ N 次
    require_original_content: true   # AI 判断：必须有一手洞察，非纯转述
    require_feed_source: true        # 必须有可订阅的 RSS/博客/GitHub

  # 影响力评分权重（三维加权，总和=1.0）
  influence_score:
    content_quality: 0.50      # 内容质量（一手洞察 vs 转述）
    citation_count: 0.30       # 被其他信息源引用次数
    activity_rate: 0.20        # 最近 7 天是否有更新（活跃度）

  # 更新报告输出路径
  report_output_dir: "03-tracking-registry/update-reports"

# ============================================================
# 日报输出配置
# ============================================================
report:
  output_dir: "01-daily-reports"
  language: "zh"
  timezone: "Asia/Shanghai"

# 信息过滤配置
filter:
  hours_lookback: 24
  max_items_per_feed: 5
