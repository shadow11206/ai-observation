<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>追踪体系 — AI Observation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    /* ---- Tab Nav ---- */
    .tab-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: none;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ---- Group sections ---- */
    .group-section {
      margin-bottom: 3rem;
    }
    .group-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* ---- Company Grid ---- */
    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .company-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 1.25rem 1.5rem;
      transition: box-shadow 0.25s var(--ease), transform 0.2s var(--ease);
    }
    .company-card:hover {
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }
    .company-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--text-primary);
    }
    .company-product {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }
    .company-focus {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .company-freq {
      display: inline-block;
      margin-top: 0.6rem;
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 2px 9px;
    }

    /* ---- Source Grid ---- */
    .source-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .source-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 0.9rem 1.2rem;
      transition: box-shadow 0.2s;
    }
    .source-item:hover { box-shadow: var(--shadow-sm); }
    .source-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 140px;
      flex-shrink: 0;
    }
    .source-author {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 1px;
    }
    .source-value {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
    }
    .source-freq-badge {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      flex-shrink: 0;
      padding-top: 2px;
    }

    /* ---- Risk Notice ---- */
    .risk-banner {
      background: #fff8f0;
      border: 1px solid #ffd4a0;
      border-radius: var(--r-md);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .risk-banner strong { color: var(--text-primary); }
    .risk-row {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .risk-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 100px;
      border: 1px solid var(--border);
    }
    .risk-chip.safe   { background: #f0fff4; border-color: #b7f0c8; color: #1e7e3a; }
    .risk-chip.warn   { background: #fffbea; border-color: #ffe06b; color: #8a6900; }
    .risk-chip.banned { background: #fff0f0; border-color: #ffb3b3; color: #c0392b; }

    /* ---- Stats row ---- */
    .tracking-stats {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .tracking-stat-item {
      text-align: center;
    }
    .tracking-stat-num {
      font-size: 2rem;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }
    .tracking-stat-label {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 0.1rem;
    }

    /* ---- Loading ---- */
    .loading-msg {
      text-align: center;
      color: var(--text-tertiary);
      padding: 4rem 2rem;
      font-size: 15px;
    }

    /* ---- Cat header ---- */
    .cat-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .cat-header h2 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .cat-count {
      font-size: 13px;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">AI Observation</a>
      <ul class="nav-links">
        <li><a href="daily.html">日报</a></li>
        <li><a href="research.html">深度调研</a></li>
        <li><a href="opinions.html">我的判断</a></li>
        <li><a href="tracking.html" style="color:var(--text-primary)">追踪体系</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-hero">
    <div class="page-hero-eyebrow">追踪体系</div>
    <h1>信号来源<br />三级优先级</h1>
    <p id="hero-desc">L1 实践者 > L2 观察者 > L3 决策者，动态加载中…</p>
  </div>

  <div class="tracking-container">
    <div id="loading" class="loading-msg">数据加载中…</div>
    <div id="content" style="display:none">
      <!-- Stats -->
      <div class="tracking-stats reveal" id="stats-row"></div>

      <!-- Tab Nav -->
      <div class="tab-nav reveal" id="tab-nav">
        <button class="tab-btn active" data-tab="people">👤 人物追踪</button>
        <button class="tab-btn" data-tab="companies">🏢 公司追踪</button>
        <button class="tab-btn" data-tab="sources">📰 信息源</button>
      </div>

      <!-- People Tab -->
      <div class="tab-panel active" id="tab-people"></div>

      <!-- Companies Tab -->
      <div class="tab-panel" id="tab-companies"></div>

      <!-- Sources Tab -->
      <div class="tab-panel" id="tab-sources"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="footer-logo">AI Observation</div>
        <p>让 AI 行业洞察变得系统化、可持续、有观点</p>
      </div>
      <div class="footer-links">
        <div class="footer-col">
          <div class="footer-col-title">内容</div>
          <a href="daily.html">每日日报</a>
          <a href="research.html">深度调研</a>
          <a href="opinions.html">我的判断</a>
        </div>
        <div class="footer-col">
          <div class="footer-col-title">体系</div>
          <a href="tracking.html">追踪名单</a>
          <a href="https://github.com/shadow11206/ai-observation" target="_blank">GitHub</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 AI Observation</span></div>
  </footer>

  <script src="scripts/main.js"></script>
  <script>
  // ====================================================
  //  tracking.js — 动态渲染追踪体系页面
  // ====================================================

  const DATA_URL = 'data/tracking.json';

  // Tab 切换
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  async function loadTracking() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
    } catch(e) {
      document.getElementById('loading').textContent = '数据加载失败，请检查 ui/data/tracking.json 是否存在。(' + e.message + ')';
    }
  }

  function render(data) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    const m = data.meta || {};
    // Hero desc
    document.getElementById('hero-desc').textContent =
      `L1 实践者 > L2 观察者 > L3 决策者，覆盖 ${m.people_total || 0} 位人物、${m.company_count || 0} 家公司`;

    renderStats(m);
    renderPeople(data.people);
    renderCompanies(data.companies);
    renderSources(data.sources);

    // 触发 reveal 动画
    setTimeout(() => {
      document.querySelectorAll('.reveal').forEach(el => {
        el.classList.add('visible');
      });
    }, 80);
  }

  // ---- Stats ----
  function renderStats(m) {
    const items = [
      { num: m.l1_count || 0,       label: 'L1 实践者' },
      { num: m.l2_count || 0,       label: 'L2 观察者' },
      { num: m.l3_count || 0,       label: 'L3 决策者' },
      { num: m.company_count || 0,  label: '追踪公司' },
    ];
    document.getElementById('stats-row').innerHTML = items.map(i => `
      <div class="tracking-stat-item">
        <div class="tracking-stat-num">${i.num}</div>
        <div class="tracking-stat-label">${i.label}</div>
      </div>
    `).join('');
  }

  // ---- People ----
  function renderPeople(people) {
    const el = document.getElementById('tab-people');
    let html = '';

    const levelMap = {
      l1: { label: 'L1 实践者 / 构建者', cls: 'level-l1', badge: 'L1 实践者', desc: '在一线做产品、写代码、有原创思想框架' },
      l2: { label: 'L2 深度观察者', cls: 'level-l2', badge: 'L2 观察者', desc: '有最深入的行业解读，Newsletter/播客' },
      l3: { label: 'L3 战略决策者', cls: 'level-l3', badge: 'L3 决策者', desc: 'CEO/首席科学家，定方向' },
    };

    // L1
    const l1 = people.l1;
    if (l1 && l1.groups && l1.groups.length) {
      const info = levelMap.l1;
      html += `<div class="tracking-section reveal">
        <div class="tracking-section-header">
          <h2>${info.label}</h2>
          <span class="tracking-count">优先级最高</span>
        </div>
        <p style="font-size:15px;color:var(--text-secondary);margin-bottom:1.5rem;">${info.desc}</p>`;
      l1.groups.forEach(g => {
        html += `<div class="group-section">
          <div class="group-title">${escHtml(g.group)}</div>
          <div class="people-grid">`;
        g.people.forEach(p => {
          html += personCard(p, info.badge, info.cls);
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    }

    // L2
    const l2 = people.l2;
    if (l2 && l2.groups && l2.groups.length) {
      const info = levelMap.l2;
      html += `<div class="tracking-section reveal">
        <div class="tracking-section-header">
          <h2>${info.label}</h2>
          <span class="tracking-count">高质量二手洞察</span>
        </div>
        <p style="font-size:15px;color:var(--text-secondary);margin-bottom:1.5rem;">${info.desc}</p>`;
      l2.groups.forEach(g => {
        html += `<div class="group-section">
          <div class="group-title">${escHtml(g.group)}</div>
          <div class="people-grid">`;
        g.people.forEach(p => {
          html += personCard(p, info.badge, info.cls);
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    }

    // L3
    const l3 = people.l3;
    if (l3 && l3.people && l3.people.length) {
      const info = levelMap.l3;
      html += `<div class="tracking-section reveal">
        <div class="tracking-section-header">
          <h2>${info.label}</h2>
          <span class="tracking-count">方向判断</span>
        </div>
        <p style="font-size:15px;color:var(--text-secondary);margin-bottom:1.5rem;">${info.desc}</p>
        <div class="people-grid">`;
      l3.people.forEach(p => {
        html += personCard(p, info.badge, info.cls);
      });
      html += `</div></div>`;
    }

    el.innerHTML = html;
  }

  function personCard(p, badge, cls) {
    const score = p.score ? `<span style="font-size:11px;color:var(--text-tertiary);margin-left:6px;">影响力 ${p.score}</span>` : '';
    const freq = p.freq ? `<span class="company-freq">${escHtml(p.freq)}</span>` : '';
    const keywords = p.keywords ? `<div style="font-size:11px;color:var(--text-tertiary);margin-top:0.4rem;">🔍 ${escHtml(p.keywords)}</div>` : '';
    return `<div class="person-card">
      <span class="person-level ${cls}">${badge}</span>${score}
      <div class="person-name">${escHtml(p.name)}</div>
      <div class="person-org">${escHtml(p.role || '')}</div>
      <div class="person-focus">${escHtml(p.focus || '')}</div>
      ${keywords}
      ${freq}
    </div>`;
  }

  // ---- Companies ----
  function renderCompanies(companies) {
    const el = document.getElementById('tab-companies');
    if (!companies || !companies.length) {
      el.innerHTML = '<div class="loading-msg">暂无公司数据</div>';
      return;
    }
    let html = '';
    companies.forEach(cat => {
      const totalCount = cat.subcategories.reduce((s, sub) => s + sub.companies.length, 0);
      html += `<div class="tracking-section reveal">
        <div class="cat-header">
          <h2>${escHtml(cat.category)}</h2>
          <span class="cat-count">${totalCount} 家</span>
        </div>`;
      cat.subcategories.forEach(sub => {
        if (!sub.companies.length) return;
        if (sub.sub) {
          html += `<div class="group-section">
            <div class="group-title">${escHtml(sub.sub)}</div>`;
        } else {
          html += `<div class="group-section">`;
        }
        html += `<div class="company-grid">`;
        sub.companies.forEach(c => {
          html += `<div class="company-card">
            <div class="company-name">${escHtml(c.name)}</div>
            ${c.product ? `<div class="company-product">${escHtml(c.product)}</div>` : ''}
            ${c.focus ? `<div class="company-focus">${escHtml(c.focus)}</div>` : ''}
            ${c.freq ? `<span class="company-freq">${escHtml(c.freq)}</span>` : ''}
          </div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    });
    el.innerHTML = html;
  }

  // ---- Sources ----
  function renderSources(sources) {
    const el = document.getElementById('tab-sources');
    if (!sources) {
      el.innerHTML = '<div class="loading-msg">暂无信源数据</div>';
      return;
    }
    let html = '';

    // Risk notice
    html += `<div class="risk-banner reveal">
      <strong>⚠️ 信源风险分级</strong>
      <div class="risk-row">
        <span class="risk-chip safe">🟢 安全 — 可直接引用</span>
        <span class="risk-chip warn">🟡 高危 — 必须验证日期</span>
        <span class="risk-chip banned">🔴 禁用 — CSDN / 知乎回答</span>
      </div>
    </div>`;

    // Overview
    if (sources.overview && sources.overview.length) {
      html += `<div class="tracking-section reveal">
        <div class="tracking-section-header">
          <h2>信息源概览</h2>
          <span class="tracking-count">${sources.overview.length} 类</span>
        </div>
        <div class="company-grid">`;
      sources.overview.forEach(o => {
        html += `<div class="company-card">
          <div class="company-name">${escHtml(o.type)}</div>
          ${o.definition ? `<div class="company-focus">${escHtml(o.definition)}</div>` : ''}
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem;">
            ${o.freq ? `<span class="company-freq">${escHtml(o.freq)}</span>` : ''}
            ${o.count ? `<span class="company-freq">${escHtml(o.count)}</span>` : ''}
          </div>
        </div>`;
      });
      html += `</div></div>`;
    }

    // Categories
    if (sources.categories && sources.categories.length) {
      sources.categories.forEach(cat => {
        const totalItems = cat.subcategories.reduce((s, sub) => s + sub.items.length, 0);
        html += `<div class="tracking-section reveal">
          <div class="cat-header">
            <h2>${escHtml(cat.category)}</h2>
            <span class="cat-count">${totalItems} 个</span>
          </div>`;
        cat.subcategories.forEach(sub => {
          if (!sub.items.length) return;
          if (sub.sub) {
            html += `<div class="group-section"><div class="group-title">${escHtml(sub.sub)}</div>`;
          } else {
            html += `<div class="group-section">`;
          }
          html += `<div class="source-list">`;
          sub.items.forEach(item => {
            html += `<div class="source-item">
              <div>
                <div class="source-name">${escHtml(item.name)}</div>
                ${item.author ? `<div class="source-author">${escHtml(item.author)}</div>` : ''}
              </div>
              <div class="source-value">${escHtml(item.value || '')}</div>
              ${item.freq ? `<div class="source-freq-badge">${escHtml(item.freq)}</div>` : ''}
            </div>`;
          });
          html += `</div></div>`;
        });
        html += `</div>`;
      });
    }

    el.innerHTML = html;
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadTracking();
  </script>
</body>
</html>
