title: "AI Observation"
description: "个人 AI 行业洞察系统 — 系统化追踪 AI 行业动态，沉淀观点，输出内容"
author: "tujia"
url: "https://shadow11206.github.io"
baseurl: "/ai-observation"

# 主题：使用 just-the-docs（简洁文档风格，支持搜索和导航）
remote_theme: just-the-docs/just-the-docs

# 搜索
search_enabled: true
search:
  heading_level: 2
  previews: 3

# 导航排序
nav_sort: case_sensitive

# 颜色主题
color_scheme: light

# 页脚
footer_content: "AI Observation · 让洞察变得系统化"

# 插件
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# 排除不需要渲染的目录
exclude:
  - scripts/
  - "*.py"
  - "*.yaml"
  - "*.txt"
  - node_modules/
  - .git/
