name: Daily AI Report

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 北京时间 10:00（OpenRouter 日数据已稳定）
  workflow_dispatch:       # 支持手动触发（Actions 页面点 Run workflow）

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 需要写入权限以 commit 日报

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "❌ 错误：AI_API_KEY 未配置"
            echo "请前往：仓库 Settings → Secrets and variables → Actions → New repository secret"
            echo "添加 AI_API_KEY（你的 DeepSeek/OpenAI API Key）"
            echo "添加 AI_API_BASE（如 https://api.deepseek.com）"
            exit 1
          fi
          echo "✅ API Key 已配置"
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Generate daily report
        run: python scripts/generate_daily.py
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build daily index
        run: python scripts/build_daily_index.py

      - name: Commit and push report
        run: |
          git config user.name "AI Observer Bot"
          git config user.email "bot@ai-observation.local"
          git add 01-daily-reports/ ui/data/daily-index.json
          git diff --staged --quiet || git commit -m "📰 Daily report $(date +%Y-%m-%d)"
          git push

      - name: Publish to WeChat
        if: success()
        continue-on-error: true  # IP 白名单等非代码问题不应阻断日报流程
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
        run: python scripts/publish_wechat.py
